name: Module C iOS verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/module-c-ios.yml"
      - "assets/data/dishes.json"
      - "ios/**"
      - "lib/**"
      - "test/**"
      - "tool/verify_module_c.ps1"
      - "pubspec.*"
  pull_request:
    paths:
      - ".github/workflows/module-c-ios.yml"
      - "assets/data/dishes.json"
      - "ios/**"
      - "lib/**"
      - "test/**"
      - "tool/verify_module_c.ps1"
      - "pubspec.*"

concurrency:
  group: module-c-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Run Flutter and iOS checks
        shell: pwsh
        run: ./tool/verify_module_c.ps1

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-c-verification-log
          path: build/module_c_verification/latest.log
          if-no-files-found: warn
          retention-days: 14
